<!doctype html>
<html lang="ru" class="booting">
<head>
<meta charset="utf-8">

<body>
<main id="viewport" aria-label="Презентация">
  <div id="stage">
    <nav id="chrome" aria-label="Навигация по слайдам">
      <button id="prev" type="button" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="counter" aria-hidden="true"></span>
      <button id="next" type="button" aria-label="Следующий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
    <div id="progress" aria-hidden="true"></div>
  </div>
</main>
<div id="rotate" role="alert">
  <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="30" y="12" width="36" height="72" rx="8"/><path d="M42 74h12"/></svg>
  <h2>Поверните телефон</h2>
  <p>Презентация сделана для горизонтального экрана</p>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<script src="js/slides.js"></script>
<script src="js/deck.js"></script>
