<!doctype html>
<html lang="ru" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Павел Анцибор. Портфолио</title>
<meta name="description" content="Портфолио Павла Анцибора: семь проектов, сервисы для звукоизоляции MultiFrame, сайты и CRM.">
<meta name="theme-color" content="#0f1d18">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Портфолио">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="preload" href="assets/fonts/GolosText.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/deck.css">
<noscript><style>html.booting #stage{opacity:1}</style></noscript>
</head>
<body>
<main id="viewport" aria-label="Презентация">
  <div id="stage">
    <nav id="chrome" aria-label="Навигация по слайдам">
      <button id="fs" type="button" data-fs aria-label="На весь экран" title="На весь экран (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button id="prev" type="button" aria-label="Предыдущий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="counter" aria-hidden="true"></span>
      <button id="next" type="button" aria-label="Следующий слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
    <div id="progress" aria-hidden="true"></div>
  </div>
</main>
<div id="rotate" role="alert">
  <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="30" y="12" width="36" height="72" rx="8"/><path d="M42 74h12"/></svg>
  <h2>Поверните телефон</h2>
  <p>Презентация сделана для горизонтального экрана</p>
  <button type="button" class="fs-cta fs-cta--big" data-fs><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>Открыть на весь экран</span></button>
  <p class="ios-hint">Чтобы открыть на весь экран, нажмите «Поделиться» → «На экран „Домой“»</p>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<script src="js/slides.js"></script>
<script src="js/deck.js"></script>
</body>
</html>
